# Metrics window size
metrics.window=10000
# Metrics report interval, in seconds
metrics.interval=60

# Delay between sending records, in milliseconds
probe.interval=5000

# Prometheus endpoint port
prometheus.port=8080

# Appname used in RELP record
record.appname=rlp_11
# Hostname used in RELP record
record.hostname=rlp_11

# RELP Server target address
target.hostname=127.0.0.1
# Relp Server target port
target.port=12346
# RELP Server reconnect interval, in milliseconds
target.reconnectinterval=2000
# Number of events/reconnects before triggering a RELP Server connection rebind
target.rebindamount=5
# Boolean flag to enable or disable RELP Server connection rebinding
target.rebind-enabled=true
# RELP Server maximum idle connection duration, in seconds
target.maxidleseconds=10
# Boolean flag to enable or disable the maximum idle connection timeout
target.maxidle-enabled=true
# Boolean flag to enable or disable TLS, defaults to disabled

tls.enabled=true
# TLS path to keystore
tls.keystore.path=src/test/resources/client-keystore.p12
# TLS keystore password
tls.keystore.password=password
# TLS protocol to be used
tls.protocol=TLSv1.3
